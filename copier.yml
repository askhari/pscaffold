# copier configuration for pscaffold product repositories.
_min_copier_version: "9.5"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_envops:
  keep_trailing_newline: true

# Files owned by the product once generated: copier never overwrites them on update.
_skip_if_exists:
  - docs/brief.md
  - docs/adr/README.md
  - .github/CODEOWNERS

_message_after_copy: |
  Generated {{ project_name }}.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    devbox run -- just setup
    devbox run -- just verify

_tasks:
  - command: "[ -d .git ] || git init -q -b main"
  - command: devbox run -- just setup
    when: "{{ run_setup }}"
  # The documents written before the render (brief, ADRs, copier answers) never went through
  # the edit hook: format them once so the first `just verify` is green.
  - command: devbox run -- just format
    when: "{{ run_setup and _copier_operation == 'copy' }}"

project_name:
  type: str
  help: Human-readable product name
  validator: "{% if not project_name %}Required{% endif %}"

project_slug:
  type: str
  help: Kebab-case identifier (repo name, Docker image)
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*[a-z0-9]$')) %}Use lowercase letters, digits and dashes{% endif %}

description:
  type: str
  help: One-line description
  default: "{{ project_name }}"

github_owner:
  type: str
  help: GitHub user or organization that owns the repository
  validator: >-
    {% if not (github_owner | regex_search('^[A-Za-z0-9][A-Za-z0-9-]*$')) %}Required: a GitHub user or organization{% endif %}

bundle_id:
  type: str
  help: iOS bundle identifier / Android package name
  default: "com.{{ github_owner | lower | replace('-', '') }}.{{ project_slug | replace('-', '') }}"

agent_name:
  type: str
  help: Git author name for commits made by agents (kept apart from human commits in git blame)
  default: "{{ github_owner }}-agent"
  validator: "{% if not agent_name %}Required{% endif %}"

agent_email:
  type: str
  help: Git author email for commits made by agents
  default: "{{ github_owner }}-agent@users.noreply.github.com"
  validator: >-
    {% if not (agent_email | regex_search('^[^@\\s]+@[^@\\s]+$')) %}Use an email address{% endif %}

backend:
  type: str
  help: API implementation language
  choices:
    Go (default): go
    Rust: rust
  default: go

go_module:
  type: str
  help: Go module path of the API
  default: "github.com/{{ github_owner }}/{{ project_slug }}/apps/api"
  when: "{{ backend == 'go' }}"

platform_product:
  type: str
  help: Product name on the shared platform (database <name>_<env>, directory and container <name>-<env>)
  default: "{{ project_slug | replace('-', '') }}"
  validator: >-
    {% if not (platform_product | regex_search('^[a-z][a-z0-9_]*$')) %}Use lowercase letters, digits and underscores (it names a PostgreSQL database){% endif %}

dev_db_port:
  type: int
  help: Local Postgres port for this project (the default is derived from the slug, so each product gets its own)
  default: "{{ 20000 + ((project_slug | hash('md5'))[:6] | int(base=16)) % 10000 }}"
  validator: >-
    {% if dev_db_port < 1024 or dev_db_port > 65535 %}Use a port between 1024 and 65535{% endif %}

run_setup:
  type: bool
  help: Install dependencies and generate code after copying (needs Devbox, Node, and the backend's language)
  default: true
